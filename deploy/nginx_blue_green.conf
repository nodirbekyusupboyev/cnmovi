# CNMOVI Zero-Downtime Blue-Green Nginx Reverse Proxy Configuration
upstream cnmovi_backend_cluster {
    server 127.0.0.1:8000 weight=10 max_fails=2 fail_timeout=5s; # Blue Instance
    server 127.0.0.1:8001 backup;                                # Green Zero-Downtime Failover
}

server {
    listen 80;
    server_name cinemabot.uz;

    location /api/ {
        proxy_pass http://cnmovi_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /ws/ {
        proxy_pass http://cnmovi_backend_cluster;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
    }
}
